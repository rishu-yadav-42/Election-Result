{% extends 'base.html' %}
{% block title %}Add Election{% endblock %}
{% block content %}
<section class="section narrow">
  <h1 class="page-title">ADD ELECTION</h1>
  <div class="panel">
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label>Election Type</label>
        <select name="election_type" required>
          <option value="lok_sabha">Lok Sabha</option>
          <option value="vidhan_sabha" selected>Vidhan Sabha</option>
        </select>
      </div>

      <div class="form-group">
        <label>State</label>
        <select name="state_id" required>
          <option value="">Select State</option>
          {% for s in states %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label>Election Year</label>
        <input type="number" name="year" min="1950" max="2100" placeholder="e.g. 2024" required>
      </div>

      <p class="muted">The election name is generated automatically, e.g. "Uttar Pradesh Vidhan Sabha Election 2022".</p>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Create Election</button>
        <a href="{{ url_for('admin.dashboard') }}" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</section>
{% endblock %}
